<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocus</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 380px;
    height: 580px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
    background: linear-gradient(135deg, #f4f4f4 0%, #e8e8e8 100%);
    overflow: hidden;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
}

/* Header */
.header {
    background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
    padding: 24px 20px 20px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    gap: 12px;
}

.logo {
    height: 50px;
    background-size: contain;
}

@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
}

.header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
}

.url-preview {
    font-size: 11px;
    color: #6b7280;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    margin-top: 6px;
    padding: 6px 12px;
    background: #f9fafb;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
}

/* Main Content */
.content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    scrollbar-width: thin;
    scrollbar-color: #4A90E2 #f4f4f4;
}

.content::-webkit-scrollbar {
    width: 6px;
}

.content::-webkit-scrollbar-track {
    background: #f4f4f4;
}

.content::-webkit-scrollbar-thumb {
    background: #4A90E2;
    border-radius: 3px;
}

/* Connection Status */
.connection-status {
    text-align: center;
    padding: 40px 20px;
}

.status-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
}

.status-icon.error {
    background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
}

.connection-status h2 {
    font-size: 18px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 10px;
}

.connection-status p {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.6;
}

.connection-status strong {
    color: #4A90E2;
    font-weight: 600;
}

/* Album Browser */
.album-browser {
    display: none;
}

.album-browser.active {
    display: block;
}

.section-header {
    font-size: 11px;
    font-weight: 700;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-header::before {
    content: '';
    width: 3px;
    height: 12px;
    background: linear-gradient(180deg, #4A90E2 0%, #357ABD 100%);
    border-radius: 2px;
}

.albums-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.album-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 18px 12px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    border: 2px solid #e5e7eb;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.album-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    opacity: 0;
    transition: opacity 0.25s ease;
}

.album-card:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 20px rgba(74, 144, 226, 0.15);
    border-color: #4A90E2;
}

.album-card:hover::before {
    opacity: 1;
}

.album-card.selected {
    border-color: #4A90E2;
    background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);
    box-shadow: 0 4px 16px rgba(74, 144, 226, 0.2);
}

.album-card.selected::after {
    content: '✓';
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    background: #4A90E2;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

.album-icon {
    margin-bottom: 10px;
    text-align: center;
    height: auto;
}

.album-icon img {
    width: 40px;    
    object-fit: contain;
    display: block;
    margin: 0 auto;
}


.album-name {
    font-size: 13px;
    font-weight: 600;
    color: #1f2937;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
    z-index: 1;
}

.album-count {
    font-size: 11px;
    color: #9ca3af;
    font-weight: 500;
    position: relative;
    z-index: 1;
}

.no-albums {
    text-align: center;
    padding: 50px 20px;
    color: #6b7280;
}

.no-albums-icon {
    font-size: 56px;
    margin-bottom: 16px;
    opacity: 0.6;
}

.no-albums p {
    font-size: 14px;
    color: #1f2937;
    font-weight: 600;
    margin-bottom: 8px;
}

.no-albums p:last-child {
    font-size: 12px;
    color: #9ca3af;
    font-weight: 400;
    line-height: 1.5;
}

/* Buttons */
.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 0.3px;
}

.btn-primary {
    background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
}

.btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
}

.btn-primary:active:not(:disabled) {
    transform: translateY(0);
}

.btn-primary:disabled {
    background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 100%);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.btn-secondary {
    background: #ffffff;
    color: #4A90E2;
    border: 2px solid #4A90E2;
    margin-top: 10px;
    box-shadow: 0 2px 8px rgba(74, 144, 226, 0.1);
}

.btn-secondary:hover {
    background: linear-gradient(135deg, #f0f7ff 0%, #e6f2ff 100%);
    box-shadow: 0 4px 12px rgba(74, 144, 226, 0.2);
    transform: translateY(-2px);
}

/* Loading Animation */
.loading-overlay {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 1000;
}

.loading-overlay.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.popup-swirl {
    width: 90px;
    height: auto;
    display: block;
}

.loading-text {
    margin-top: 20px;
    font-size: 15px;
    color: #1f2937;
    font-weight: 600;
}

/* Success Animation */
.success-overlay {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 1000;
}

.success-overlay.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

.checkmark {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 8px 24px rgba(74, 144, 226, 0.4);
    position: relative;
}

.checkmark::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
    opacity: 0.3;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.1); opacity: 0.1; }
}

.checkmark::after {
    content: '✓';
    font-size: 42px;
    color: #ffffff;
    font-weight: bold;
    position: relative;
    z-index: 1;
}

@keyframes scaleIn {
    0% {
        transform: scale(0) rotate(-45deg);
        opacity: 0;
    }
    50% {
        transform: scale(1.1) rotate(5deg);
    }
    100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
    }
}

.success-text {
    margin-top: 24px;
    font-size: 18px;
    color: #1f2937;
    font-weight: 700;
    animation: slideUp 0.4s ease 0.2s backwards;
}

@keyframes slideUp {
    from {
        transform: translateY(20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* Quick Save Section */
.quick-save-section {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #e5e7eb;
}

.quick-save-text {
    font-size: 11px;
    color: #9ca3af;
    text-align: center;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
}

/* Retry Button Special Styling */
#retryBtn {
    margin-top: 24px;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div><img class="logo" src="./icons/RocusSwirlBlue.png" /></div>
            </div>
            <div class="url-preview" id="urlPreview">Loading...</div>
        </div>

        <div class="content">
            <div class="connection-status" id="connectionStatus" style="display: none;">
                <div class="status-icon error">⚠️</div>
                <h2>Rocus Not Open</h2>
                <p>Please open <strong>https://rocus.io</strong> in your browser to use this extension.</p>
                <button class="btn btn-primary" id="retryBtn">Retry Connection</button>
            </div>

            <div class="album-browser" id="albumBrowser">
                <div class="section-header">Tap an Album to Save</div>

                <div class="albums-grid" id="albumsGrid">
                </div>

                <div class="no-albums" id="noAlbumsMsg" style="display: none;">
                    <div class="no-albums-icon">📂</div>
                    <p>No albums yet</p>
                    <p>Create albums in Rocus to organize your links</p>
                </div>

                <div class="quick-save-section">
                    <div class="quick-save-text">or save without album</div>
                    <button class="btn btn-secondary" id="quickSaveBtn">Quick Save</button>
                </div>
            </div>
        </div>

        <div class="loading-overlay" id="loadingOverlay">
            <svg id="rocusSwirlSvg" class="popup-swirl" viewBox="0 0 839 1076" role="img" aria-label="Saving">
                <g id="rocusSwirlG">
                    <path id="rocusSwirlPath" fill="none" stroke="#4A90E2" stroke-width="80" stroke-linecap="butt" stroke-linejoin="round" />
                </g>
            </svg>
            <div class="loading-text" id="loadingText">Processing...</div>
        </div>

        <div class="success-overlay" id="successOverlay">
            <div class="checkmark"></div>
            <div class="success-text">Saved Successfully</div>
        </div>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
